[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# old links keep working
[[redirects]]
  from = "/book.html"
  to = "/book"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# 2026-10-12 services renamed for clarity + SEO (Interior → House Cleaning etc.)
# specific rules first, then wildcards
[[redirects]]
  from = "/services/interior"
  to = "/services/house-cleaning"
  status = 301
  force = true

[[redirects]]
  from = "/services/interior/standard-cleaning"
  to = "/services/house-cleaning/regular-cleaning"
  status = 301
  force = true

[[redirects]]
