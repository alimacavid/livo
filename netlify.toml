[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# old links keep working
[[redirects]]
  from = "/book.html"
  to = "/book"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# 2026-10-11 services restructure — old service URLs
[[redirects]]
  from = "/services/interior/move-in-move-out"
  to = "/services/move/move-in-move-out"
  status = 301
  force = true

[[redirects]]
  from = "/services/interior/post-construction-cleaning"
  to = "/services/construction/post-construction-cleaning"
  status = 301
  force = true

# Power Washing & Windows removed for now
[[redirects]]
  from = "/services/power"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/services/power/*"
  to = "/services"
  status = 301
  force = true
