<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVO Services Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --purple:#8E3AAC;--deep:#5F2491;--pale:#f3e8f9;--lime:#C8D700;--lime-dk:#a0ac00;--lime-pale:#f5f8cc;
  --ink:#0c0c0c;--soft:#3d3d3d;--muted:#737373;--border:#e2e2e2;--bg:#faf9fb;
  --heading:'Montserrat',system-ui,sans-serif;--body:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:110px}
h1,h2,h3,h4{font-family:var(--heading)}

.wrap{max-width:900px;margin:0 auto;padding:26px 18px 20px}
.hd h1{font-size:1.45rem;font-weight:800;color:var(--ink);margin:0 0 4px;letter-spacing:-.01em}
.hd h1 em{color:var(--deep);font-style:normal}
.hd p{font-size:.82rem;color:var(--muted);margin:0 0 14px}
.hint{display:none}

/* service tabs */
.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.tab{font-family:var(--heading);font-size:.74rem;font-weight:700;letter-spacing:.01em;color:var(--soft);background:#fff;border:1.5px solid var(--border);border-radius:100px;padding:8px 15px;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap}
.tab:hover{border-color:var(--purple);color:var(--purple)}
.tab.active{background:linear-gradient(135deg,var(--purple),var(--deep));border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(95,36,145,.25)}

.svc-intro{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.svc-intro .ico{width:34px;height:34px;background:linear-gradient(135deg,var(--purple),var(--deep));border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.svc-intro .ico svg{width:18px;height:18px;stroke:#fff;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.svc-intro h2{font-size:1rem;font-weight:800;color:var(--ink)}
.svc-intro p{font-size:.76rem;color:var(--muted)}

#groups{display:block}
#grid-inner{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:700px){#grid-inner{grid-template-columns:repeat(2,1fr)}}

/* ===== home-size picker (step 1) — bold tier cards ===== */
.size-head{margin:6px 0 16px}
.size-head h3{font-size:1.15rem;font-weight:800;color:var(--ink)}
.size-head p{font-size:.82rem;color:var(--muted);margin-top:2px}
.size-stage{background:#1a0a2e;border-radius:22px;padding:24px 18px}
.size-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:760px){.size-grid{grid-template-columns:repeat(4,1fr)}}
.szc{position:relative;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);border-radius:18px;padding:26px 16px 20px;text-align:center;cursor:pointer;transition:all .25s var(--ease);overflow:hidden}
.szc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:transparent;transition:background .25s}
.szc:hover{background:var(--lime);border-color:var(--lime)}
.szc:hover::before{background:rgba(0,0,0,.25)}
.szc:hover .szc-ico{background:rgba(0,0,0,.12)}
.szc:hover .szc-ico svg{stroke:var(--ink)}
.szc:hover .szc-name{color:var(--ink)}
.szc:hover .szc-sub{color:rgba(0,0,0,.55)}
.szc:hover .szc-cta{background:var(--ink);color:#fff}
.szc.on{background:var(--lime);border-color:var(--lime)}
.szc.on::before{background:rgba(0,0,0,.25)}
.szc-ico{width:56px;height:56px;margin:0 auto 14px;border-radius:15px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;transition:background .25s}
.szc.on .szc-ico{background:rgba(0,0,0,.12)}
.szc-ico svg{width:30px;height:30px;stroke:#fff;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
.szc.on .szc-ico svg{stroke:var(--ink)}
.szc-name{font-family:var(--heading);font-weight:800;font-size:1.05rem;color:#fff;transition:color .25s}
.szc.on .szc-name{color:var(--ink)}
.szc-sub{font-size:.74rem;color:rgba(255,255,255,.45);margin-top:4px;margin-bottom:16px;transition:color .25s}
.szc.on .szc-sub{color:rgba(0,0,0,.55)}
.szc-cta{display:block;padding:11px;background:rgba(255,255,255,.1);color:#fff;font-family:var(--heading);font-weight:800;font-size:.8rem;border-radius:100px;transition:all .25s}
.szc.on .szc-cta{background:var(--ink);color:#fff}
.size-change{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:700;color:var(--deep);background:var(--pale);border:1.5px solid transparent;border-radius:100px;padding:8px 16px;cursor:pointer;margin-bottom:18px}
.size-change:hover{border-color:var(--purple)}
.size-change:hover{background:#ead9f5}

/* group card — compact menu style */
.grp{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px 18px 16px;transition:box-shadow .2s,border-color .2s}
.grp:hover{box-shadow:0 10px 24px rgba(95,36,145,.08);border-color:#e6d9ee}
.grp-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #f2eef5}
.ico2{width:40px;height:40px;background:var(--deep);border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.grp.addon .ico2{background:var(--lime-dk)}
.ico2 svg{width:21px;height:21px;stroke:#fff;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.grp.addon .ico2 svg{stroke:#fff}
.gttl{font-size:15px;font-weight:700;color:var(--ink)}
.badge{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--lime-dk);background:var(--lime-pale);padding:3px 10px;border-radius:100px;margin-left:auto;white-space:nowrap}

.rows{display:flex;flex-direction:column;gap:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:background .15s,transform .1s}
.row:hover{background:var(--pale)}
.row:active{transform:scale(.99)}
.row.sel{background:var(--lime-pale)}
.rsz{display:flex;flex-direction:column;min-width:0}
.rsz b{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rsz span{font-size:11px;color:var(--muted)}
.rtag{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#ffffff !important;background:var(--deep);padding:4px 10px;border-radius:100px;box-shadow:0 2px 6px rgba(95,36,145,.35);white-space:nowrap}
.row.sel .rtag{background:var(--lime-dk);color:#ffffff !important;box-shadow:0 2px 6px rgba(160,172,0,.35)}
.rr{display:flex;align-items:center;gap:9px;flex-shrink:0}
.pr{font-size:14.5px;font-weight:800;color:var(--deep)}
.row.sel .pr{color:var(--lime-dk)}
.chk{width:22px;height:22px;border-radius:100px;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--deep);flex-shrink:0;transition:all .15s}
.row.sel .chk{background:var(--lime-dk);border-color:var(--lime-dk);color:#fff}

/* floating cart pill */
.pill-wrap{position:fixed;left:0;right:0;bottom:20px;display:flex;justify-content:center;z-index:200;pointer-events:none}
.pill{pointer-events:auto;background:linear-gradient(135deg,var(--purple),var(--deep));color:#fff;font-family:var(--heading);font-weight:700;font-size:.88rem;border:none;border-radius:100px;padding:14px 26px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(95,36,145,.35);cursor:pointer;transition:transform .2s}
.pill:hover{transform:translateY(-2px)}
.pill .cnt{background:var(--lime);color:var(--ink);border-radius:100px;padding:2px 9px;font-size:.78rem}
.pill.hide{display:none}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(12,12,12,.4);z-index:300;display:none}
.overlay.show{display:block}
.drawer{position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100%;background:#fff;z-index:301;box-shadow:-10px 0 40px rgba(0,0,0,.15);transition:right .3s var(--ease);display:flex;flex-direction:column}
.drawer.open{right:0}
.dr-head{padding:20px 22px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.dr-head h3{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:8px}
.dr-close{width:34px;height:34px;border-radius:100px;background:#f5f2f8;border:none;font-size:17px;cursor:pointer;color:var(--soft);display:flex;align-items:center;justify-content:center}
.dr-close:hover{background:#ece5f2}
.dr-items{flex:1;overflow-y:auto;padding:14px 22px}
.dr-empty{font-size:.85rem;color:var(--muted);text-align:center;padding:40px 0}
.dr-item{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid #f0edf4}
.di-img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--pale)}
.di-mid{flex:1;min-width:0}
.di-mid b{font-size:.92rem;font-weight:800;color:var(--ink);display:block}
.di-mid .di-meta{font-size:.76rem;color:var(--muted);margin:2px 0 8px}
.di-edit{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;color:var(--deep);background:var(--pale);border:none;border-radius:100px;padding:5px 12px;cursor:pointer}
.di-edit:hover{background:#ead9f5}
.di-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.di-price{font-size:1rem;font-weight:800;color:var(--ink)}
.di-x{width:24px;height:24px;border-radius:100px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.di-x:hover{background:#f5f2f8;color:#c33}
.dr-sched{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--pale);border-radius:12px;padding:12px 14px;font-size:.85rem;font-weight:700;color:var(--ink)}
.dr-sched-edit{background:none;border:none;color:var(--deep);font-size:.78rem;font-weight:700;cursor:pointer}
.dr-sched-edit:hover{text-decoration:underline}
.dr-add{width:100%;background:#fff;border:1.5px dashed var(--border);border-radius:100px;padding:14px;font-family:var(--heading);font-weight:800;font-size:.88rem;color:var(--ink);cursor:pointer;margin:14px 0;transition:all .15s}.dr-add:hover{border-color:var(--purple);color:var(--purple);background:#fdfbfe}
.dr-disc{display:flex;align-items:center;gap:11px;border:1.5px dashed var(--lime-dk);background:var(--lime-pale);border-radius:14px;padding:14px;cursor:pointer;margin-bottom:6px}
.dr-disc .dchk{width:26px;height:26px;border-radius:8px;border:2px solid var(--deep);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;transition:all .15s}
.dr-disc.on .dchk{background:var(--deep);border-color:var(--deep)}
.dr-disc p{font-size:.85rem;font-weight:700;color:var(--ink);line-height:1.35}
.dr-disc p b{color:var(--deep)}
.dr-foot{padding:16px 22px 22px;border-top:1px solid var(--border)}
.dr-total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.dr-total .tl{font-size:.85rem;color:var(--muted);font-weight:700}
.dr-total .tv{font-family:var(--heading);font-weight:800;font-size:1.6rem;color:var(--ink)}
.dr-total .tstrike{font-size:.9rem;color:var(--muted);text-decoration:line-through;margin-right:8px;font-weight:600}
.dr-contact{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.c-in{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-family:var(--body);font-size:.9rem;color:var(--ink);transition:border-color .15s}
.c-in:focus{outline:none;border-color:var(--purple)}
.c-in.err{border-color:#e0464b;background:#fef5f5}
.dr-note.err{color:#e0464b;font-weight:600}
.dr-note.ok{color:var(--lime-dk);font-weight:700}
.dr-cta:disabled{opacity:.55;cursor:default}
.dr-cta{width:100%;background:var(--lime);color:var(--ink);border:none;border-radius:100px;padding:15px;font-family:var(--heading);font-weight:800;font-size:.95rem;cursor:pointer;transition:background .2s}
.dr-cta:hover{background:var(--lime-dk)}
.dr-note{font-size:.72rem;color:var(--muted);text-align:center;margin-top:10px}

/* ===== STEP VIEWS ===== */
#freq-view,#schedule-view{display:none}
body[data-step="freq"] #catalog-view,body[data-step="schedule"] #catalog-view{display:none}
body[data-step="freq"] #freq-view{display:block}
body[data-step="schedule"] #schedule-view{display:block}
body[data-step="freq"] .pill-wrap,body[data-step="schedule"] .pill-wrap,body[data-step="review"] .pill-wrap{display:none}
body[data-step="review"] #catalog-view{display:none}.sch-back{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;font-weight:700;color:var(--deep);background:none;border:none;cursor:pointer;margin-bottom:14px;padding:0}
.sch-back:hover{color:var(--purple)}
.sch-h1{font-size:1.45rem;font-weight:800;color:var(--ink);letter-spacing:-.01em;margin-bottom:4px}
.sch-h1 em{color:var(--deep);font-style:normal}
.sch-sub{font-size:.82rem;color:var(--muted);margin-bottom:22px}
.sch-sec{font-family:var(--heading);font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}

/* frequency step */
.fq-svc{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.fq-svc-top{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.fq-svc-top img{width:44px;height:44px;border-radius:11px;object-fit:cover;flex-shrink:0;background:var(--pale)}
.fq-svc-top b{font-size:.95rem;font-weight:800;color:var(--ink);display:block}
.fq-svc-top span{font-size:.75rem;color:var(--muted)}
.fq-opts{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(min-width:560px){.fq-opts{grid-template-columns:repeat(4,1fr)}}
.fq-opt{position:relative;border:1.5px solid var(--border);border-radius:13px;padding:13px 10px;text-align:center;cursor:pointer;transition:all .18s}
.fq-opt:hover{border-color:var(--purple)}
.fq-opt.on{border-color:var(--deep);background:var(--pale)}
.fq-opt b{display:block;font-size:.85rem;font-weight:800;color:var(--ink)}
.fq-opt .fq-sub{font-size:.65rem;color:var(--muted);margin-top:2px}
.fq-opt .fq-price{font-size:.82rem;font-weight:800;color:var(--deep);margin-top:7px}
.fq-opt .fq-save{display:inline-block;font-size:.6rem;font-weight:800;color:var(--lime-dk);background:var(--lime-pale);border-radius:100px;padding:2px 7px;margin-top:5px}

/* frequency step */
.freq-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:8px}
@media(min-width:640px){.freq-grid{grid-template-columns:repeat(4,1fr)}}
.fq{position:relative;background:#fff;border:2px solid var(--border);border-radius:16px;padding:22px 14px 18px;text-align:center;cursor:pointer;transition:all .2s var(--ease)}
.fq:hover{border-color:var(--purple);transform:translateY(-2px);box-shadow:0 10px 22px rgba(95,36,145,.1)}
.fq.on{border-color:var(--deep);background:var(--pale)}
.fq-name{font-family:var(--heading);font-weight:800;font-size:1rem;color:var(--ink)}
.fq-sub{font-size:.72rem;color:var(--muted);margin-top:3px}
.fq-save{display:inline-block;font-size:.64rem;font-weight:800;color:var(--lime-dk);background:var(--lime-pale);border-radius:100px;padding:3px 9px;margin-top:10px}
.fq-tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:100px;background:var(--deep);color:#fff;font-size:12px;font-weight:800;display:none;align-items:center;justify-content:center}
.fq.on .fq-tick{display:flex}

/* calendar — centered, comfortable size */
.sch-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;margin:0 auto 18px;max-width:420px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.cal-month{font-family:var(--heading);font-weight:800;font-size:1.05rem;color:var(--ink)}
.cal-nav{background:var(--pale);border:none;border-radius:50%;width:36px;height:36px;font-size:1rem;color:var(--deep);cursor:pointer;transition:background .2s,color .2s}
.cal-nav:hover:not(:disabled){background:var(--deep);color:#fff}
.cal-nav:disabled{opacity:.3;cursor:default}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-dow span{text-align:center;font-size:.66rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{aspect-ratio:1;border:none;background:none;border-radius:50%;font-size:.88rem;font-weight:600;color:var(--ink);cursor:pointer;transition:background .2s,color .2s;display:flex;align-items:center;justify-content:center}
.cal-day:hover:not(:disabled):not(.empty){background:var(--pale);color:var(--deep)}
.cal-day:disabled{color:#d4d0d8;cursor:default}
.cal-day.empty{visibility:hidden}
.cal-day.sel{background:linear-gradient(135deg,var(--purple),var(--deep));color:#fff;font-weight:800}
.cal-day.today:not(.sel){box-shadow:inset 0 0 0 1.5px var(--lime-dk)}
.time-opts{max-width:420px;margin:0 auto}

/* time of day */
.time-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.topt{border:1.5px solid var(--border);border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;transition:all .18s}
.topt:hover{border-color:var(--purple)}
.topt.on{border-color:var(--deep);background:var(--pale)}
.topt .tico{display:flex;justify-content:center;margin-bottom:6px}
.topt .tico svg{width:26px;height:26px;stroke:var(--muted);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .18s}
.topt:hover .tico svg{stroke:var(--purple)}
.topt.on .tico svg{stroke:var(--deep)}
.topt b{font-size:.85rem;font-weight:700;color:var(--ink)}
.topt span{display:block;font-size:.68rem;color:var(--muted);margin-top:2px}
.sch-cta{width:100%;background:var(--lime);color:var(--ink);border:none;border-radius:100px;padding:16px;font-family:var(--heading);font-weight:800;font-size:.95rem;cursor:pointer;transition:background .2s;margin-top:6px}.sch-cta:hover:not(:disabled){background:var(--lime-dk)}
.sch-cta:disabled{opacity:.4;cursor:default}

/* undo toast — centered over the drawer panel */
.undo{position:fixed;right:20px;bottom:100px;z-index:500;background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px 14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 12px 34px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-size:.88rem;font-weight:600;transform:translateY(16px);width:calc(400px - 44px);max-width:calc(92vw - 44px)}
.undo.show{opacity:1;transform:translateY(0);pointer-events:auto}
.undo span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.undo button{background:var(--lime);color:var(--ink);border:none;border-radius:100px;padding:9px 20px;font-family:var(--heading);font-weight:800;font-size:.82rem;cursor:pointer;flex-shrink:0}
.undo button:hover{background:var(--lime-dk)}

@media(max-width:640px){.wrap{padding:24px 16px}.hd h1{font-size:1.4rem}}
</style>
</head>
<body>

<div class="wrap" id="catalog-view">
  <div class="hd">
    <h1>Choose Your <em>Service</em></h1>
    <p>Prices include supplies, equipment & GST.</p>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="svc-intro" id="svc-intro"></div>
  <div id="sizepick"></div>
  <div id="groups"></div>
</div>

<div class="wrap" id="freq-view"></div>
<div class="wrap" id="schedule-view"></div>

<div class="pill-wrap"><button class="pill hide" id="pill">Continue <span class="cnt" id="pill-cnt">0</span><span id="pill-amt"></span> →</button></div>
<div class="overlay" id="overlay"></div>
<div class="undo" id="undo"><span id="undo-txt">Item removed</span><button id="undo-btn">Undo</button></div>
<div class="drawer" id="drawer">

function svcHasSizes(s){ return s.groups.some(g=>g.sizeTier); }

function renderGroups(){
  const s = SERVICES.find(x=>x.id===activeId);
  const gated = svcHasSizes(s) && sizeIdx===null;
  if(gated){ document.getElementById('groups').innerHTML=''; return; }

  const changeBar = svcHasSizes(s) ? `
    <button class="size-change" id="size-change">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      Size: <b style="font-weight:700">${SIZES[sizeIdx].name}</b> · change
    </button>` : '';

  document.getElementById('groups').innerHTML = changeBar + '<div id="grid-inner">' + s.groups.map((g,gi)=>{
    // For size-tiered groups, keep only the item matching chosen size
    let items = g.items.map((it,ii)=>({it,ii}));
    if(g.sizeTier){
      const target = g.sizeMap ? g.sizeMap[sizeIdx] : sizeIdx;
      const match = items[target] != null ? items[target] : items[items.length-1];
      items = match ? [match] : [];
    }
    if(!items.length) return '';
    return `
    <div class="grp ${g.addon?'addon':''}">
      <div class="grp-top">
        <div class="ico2"><svg viewBox="0 0 24 24">${ICONS[g.icon]}</svg></div>
        <div class="gttl">${g.title}</div>
        ${g.addon?'<span class="badge">Add-on</span>':''}
      </div>
      <div class="rows">
        ${items.map(({it,ii})=>{
          const k = keyFor(s.id,gi,ii);
          const sel = cart.some(c=>c.key===k);
          const nameHtml = g.sizeTier
            ? `${g.unit==='flat rate'?'Flat rate':'Your price'}${it.popular?'<span class="rtag">Popular</span>':''}`
            : `${it.name}${it.popular?'<span class="rtag">Popular</span>':''}`;
          const sub = g.sizeTier ? `<span>${SIZES[sizeIdx].name}</span>` : `<span>${it.sub}</span>`;
          return `<div class="row ${sel?'sel':''}" data-key="${k}" data-svc="${s.id}" data-gi="${gi}" data-ii="${ii}">
            <div class="rsz"><b>${nameHtml}</b>${sub}</div>
            <div class="rr"><span class="pr">${it.plus?'+':''}${money(it.price)}</span><span class="chk">${sel?'✓':'+'}</span></div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('') + '</div>';
}

function toggleItem(svcId,gi,ii){
  const s = SERVICES.find(x=>x.id===svcId);
  const g = s.groups[gi];
  const it = g.items[ii];
  const k = keyFor(svcId,gi,ii);
  const groupPrefix = svcId+'|'+gi+'|';
  const already = cart.find(c=>c.key===k);
  // remove any existing selection from this group (single-choice per group)
  cart = cart.filter(c=>!c.key.startsWith(groupPrefix));
  if(!already){
    cart.push({key:k, svcId:svcId, svcName:s.name, group:g.title,
               name:it.name, size:g.sizeTier?SIZES[sizeIdx].name:it.sub,
               base:it.price, price:it.price, freqId:'onetime'});
  }
  renderGroups();
  renderCart();
}

function showUndo(name){
  const t = document.getElementById('undo');
  document.getElementById('undo-txt').textContent = `${name} removed`;
  t.classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(()=>{ t.classList.remove('show'); lastRemoved=null; }, 10000);
}
function hideUndo(){ document.getElementById('undo').classList.remove('show'); clearTimeout(undoTimer); }

function removeItem(key){
  const idx = cart.findIndex(c=>c.key===key);
  if(idx<0) return;
  lastRemoved = { item: cart[idx], idx };
  cart.splice(idx,1);
  showUndo(lastRemoved.item.svcName);
  renderGroups(); renderCart();
}
function undoRemove(){
  if(!lastRemoved) return;
  cart.splice(Math.min(lastRemoved.idx, cart.length), 0, lastRemoved.item);
  lastRemoved = null;
  hideUndo();
  renderGroups(); renderCart();
}

function cartTotal(){ return cart.reduce((sum,c)=>sum+c.price,0); }

    box.innerHTML = `<div class="dr-empty">No services added yet.<br>Tap any service to add it.</div>`;
    foot.innerHTML = '';

  }

  box.innerHTML = cart.map(c=>{
    const img = SVC_IMG[c.svcId] || '';
    const meta = `${c.size} · ${freqObj(c.freqId).name}`;
    return `<div class="dr-item">
      ${img?`<img class="di-img" src="${img}" alt="" onerror="this.style.visibility='hidden'">`:'<div class="di-img"></div>'}

        <b>${c.svcName}</b>
        <div class="di-meta">${c.group} · ${meta}</div>
        <button class="di-edit" data-edit="${c.key}">✏️ Edit</button>
      </div>
      <div class="di-right">
        <div class="di-price">${money(c.price)}</div>
        <button class="di-x" data-rm="${c.key}">✕</button>
      </div>
    </div>`;
  }).join('');

  const sub = cartTotal();
  const total = firstTime ? Math.round(sub*0.70) : sub;
  const schedLine = (sched.date&&sched.time) ? (()=>{
    const dt=new Date(sched.date+'T00:00:00');
    const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()];
    return `${day}, ${MONTHS[dt.getMonth()].slice(0,3)} ${dt.getDate()} · ${sched.time}`;
  })() : '';

  foot.innerHTML = `
    ${schedLine?`<div class="dr-sched"><span>📅 ${schedLine}</span><button class="dr-sched-edit" id="dr-sched-edit">Change</button></div>`:''}
    <button class="dr-add" id="dr-add">+ Add another service</button>
    <div class="dr-disc ${firstTime?'on':''}" id="dr-disc">
      <div class="dchk">${firstTime?'✓':''}</div>
      <p>First time with LIVO? Apply my <b>30% off</b> discount</p>
    </div>
    <div class="dr-foot-inner" style="padding-top:14px">
      <div class="dr-contact">
        <input id="c-name" class="c-in" type="text" placeholder="Full name" value="${contact.name}" autocomplete="name">
        <input id="c-email" class="c-in" type="email" placeholder="Email address" value="${contact.email}" autocomplete="email">
        <input id="c-phone" class="c-in" type="tel" placeholder="Phone number" value="${contact.phone}" autocomplete="tel">
      </div>
      <div class="dr-total">
        <span class="tl">Total due first visit</span>
        <span><span class="tv">${firstTime?`<span class="tstrike">${money(sub)}</span>`:''}${money(total)}</span></span>
      </div>
      <button class="dr-cta" id="dr-cta">Confirm Booking →</button>
      <div class="dr-note" id="dr-note">No payment now — we confirm your appointment first.</div>
    </div>`;
}

document.getElementById('drawer').addEventListener('click', e=>{
  const rm = e.target.closest('[data-rm]');

  const ed = e.target.closest('[data-edit]');
  if(ed){
    const item = cart.find(c=>c.key===ed.dataset.edit);
    if(item){ activeId=item.svcId; sizeIdx=null; renderTabs(); renderIntro(); renderSizePicker(); renderGroups(); }
    closeDrawer(); goStep('catalog');
    return;
  }

  if(e.target.closest('#dr-sched-edit')){ closeDrawer(); goStep('schedule'); return; }
  if(e.target.closest('#dr-add')){ closeDrawer(); goStep('catalog'); return; }
  if(e.target.closest('#dr-disc')){ firstTime=!firstTime; renderCart(); return; }
  if(e.target.closest('#dr-cta')){ submitBooking(); return; }
});

function normPhone(p){
  const digits = (p||'').replace(/\D/g,'');
  if(digits.length===10) return '+1'+digits;
  if(digits.length===11 && digits[0]==='1') return '+'+digits;
  return p.startsWith('+') ? p : '';
}

async function submitBooking(){
  if(submitting) return;
  const nameEl=document.getElementById('c-name');
  const emailEl=document.getElementById('c-email');
  const phoneEl=document.getElementById('c-phone');
  const note=document.getElementById('dr-note');
  const cta=document.getElementById('dr-cta');

  // validate
  let bad=false;
  const emailOk=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(contact.email.trim());
  const phone=normPhone(contact.phone);
  [nameEl,emailEl,phoneEl].forEach(el=>el.classList.remove('err'));
  if(!contact.name.trim()){ nameEl.classList.add('err'); bad=true; }
  if(!emailOk){ emailEl.classList.add('err'); bad=true; }
  if(!phone){ phoneEl.classList.add('err'); bad=true; }
  if(!sched.date||!sched.time){ note.textContent='Please pick a date and time first.'; note.className='dr-note err'; return; }
  if(bad){ note.textContent='Please check your name, email, and phone.'; note.className='dr-note err'; return; }

  const payload = {
    name: contact.name.trim(),
    email: contact.email.trim(),
    phone,
    date: sched.date,
    time: sched.time,
    firstTime,
    total: firstTime ? Math.round(cartTotal()*0.70) : cartTotal(),
    items: cart.map(c=>({svcName:c.svcName, group:c.group, size:c.size, freq:freqObj(c.freqId).name, price:c.price})),
  };

  submitting=true; cta.disabled=true; cta.textContent='Sending…';
  note.textContent='Confirming your booking…'; note.className='dr-note';

  try{
    const res = await fetch(BOOKING_ENDPOINT,{
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${SUPABASE_ANON_KEY}`, 'apikey':SUPABASE_ANON_KEY },
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error||'Booking failed');
    showBookingSuccess(data.ref);
  }catch(err){
    note.textContent='Something went wrong — please call 888-802-LIVO or try again.';
    note.className='dr-note err';
    cta.disabled=false; cta.textContent='Confirm Booking →'; submitting=false;
  }
}

/* ===== MULTI-STEP FLOW ===== */
const sched = { year:new Date().getFullYear(), month:new Date().getMonth(), date:null, time:null };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const TIMES = [
  {id:'Morning', sub:'8am – 12pm', ico:'<circle cx="12" cy="14" r="4"/><path d="M12 4v2M4.5 8.5l1.4 1.4M19.5 8.5l-1.4 1.4M2 18h20"/>'},
  {id:'Afternoon', sub:'12pm – 5pm', ico:'<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/>'},
  {id:'Evening', sub:'5pm – 8pm', ico:'<path d="M20 14a8 8 0 0 1-9.9 4.9A8 8 0 1 0 20 14z"/>'},
];

function goStep(step){
  if(step==='catalog') document.body.removeAttribute('data-step');
  else document.body.setAttribute('data-step', step);
  if(step==='freq') renderFreq();
  if(step==='schedule') renderSchedule();
  if(step==='review') openDrawer();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---- STEP 2: frequency ---- */
function renderFreq(){
  const blocks = cart.map(c=>{
    return `<div class="fq-svc">
      <div class="fq-svc-top">
        <img src="${SVC_IMG[c.svcId]||''}" alt="" onerror="this.style.visibility='hidden'">
        <div><b>${c.svcName}</b><span>${c.group} · ${c.size}</span></div>
      </div>
      <div class="fq-opts">
        ${FREQS.map(f=>{
          const on=c.freqId===f.id;
          const price=Math.round(c.base*(1-f.discount));
          const save=f.discount?`<span class="fq-save">Save ${Math.round(f.discount*100)}%</span>`:'';
          return `<div class="fq-opt ${on?'on':''}" data-key="${c.key}" data-fid="${f.id}">
            <b>${f.name}</b><div class="fq-sub">${f.sub}</div><div class="fq-price">${money(price)}</div>${save}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  document.getElementById('freq-view').innerHTML = `
    <button class="sch-back" data-back="catalog">← Back to services</button>
    <h1 class="sch-h1">How <em>Often?</em></h1>
    <p class="sch-sub">Choose a schedule for each service — recurring visits save you money.</p>
    ${blocks}
    <button class="sch-cta" data-next="schedule" style="margin-top:8px">Continue →</button>`;
}

document.getElementById('freq-view').addEventListener('click', e=>{
  const back=e.target.closest('[data-back]'); if(back){ goStep(back.dataset.back); return; }
  const opt=e.target.closest('.fq-opt');
  if(opt){
    const c=cart.find(x=>x.key===opt.dataset.key);
    if(c){ c.freqId=opt.dataset.fid; c.price=Math.round(c.base*(1-freqObj(c.freqId).discount)); }
    renderFreq(); renderCart();
    return;
  }
  const nx=e.target.closest('[data-next]'); if(nx){ goStep(nx.dataset.next); return; }
});

/* ---- STEP 3: schedule ---- */
function renderSchedule(){
  const first = new Date(sched.year, sched.month, 1).getDay();
  const daysIn = new Date(sched.year, sched.month+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const isPastMonth = new Date(sched.year, sched.month+1, 0) < today;

  let cells='';
  for(let i=0;i<first;i++) cells+=`<button class="cal-day empty" disabled></button>`;
  for(let d=1;d<=daysIn;d++){
    const dt=new Date(sched.year,sched.month,d);
    const iso=`${sched.year}-${String(sched.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const past=dt<today;
    const isToday=dt.getTime()===today.getTime();
    const sel=sched.date===iso;
    cells+=`<button class="cal-day ${sel?'sel':''} ${isToday?'today':''}" data-date="${iso}" ${past?'disabled':''}>${d}</button>`;
  }

  const ready = sched.date && sched.time;
  document.getElementById('schedule-view').innerHTML = `
    <button class="sch-back" data-back="freq">← Back</button>
    <h1 class="sch-h1">Schedule Your <em>Visit</em></h1>
    <p class="sch-sub">Pick a date and time that works for you.</p>

    <p class="sch-sec">Pick a date</p>
    <div class="sch-card">
      <div class="cal-head">
        <button class="cal-nav" id="cal-prev" ${isPastMonth?'disabled':''}>←</button>
        <div class="cal-month">${MONTHS[sched.month]} ${sched.year}</div>
        <button class="cal-nav" id="cal-next">→</button>
      </div>
      <div class="cal-dow">${DOW.map(d=>`<span>${d}</span>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>

    <p class="sch-sec">Preferred time</p>
    <div class="time-opts">
      ${TIMES.map(t=>`<div class="topt ${sched.time===t.id?'on':''}" data-time="${t.id}">
        <div class="tico"><svg viewBox="0 0 24 24">${t.ico}</svg></div><b>${t.id}</b><span>${t.sub}</span>
      </div>`).join('')}
    </div>

    <button class="sch-cta" data-next="review" ${ready?'':'disabled'} style="margin-top:20px">
      ${ready?'Review Order →':'Select date & time'}
    </button>`;
}

document.getElementById('schedule-view').addEventListener('click', e=>{
  const back=e.target.closest('[data-back]'); if(back){ goStep(back.dataset.back); return; }
  const prev=e.target.closest('#cal-prev'); const next=e.target.closest('#cal-next');
  if(prev){ if(sched.month===0){sched.month=11;sched.year--;}else sched.month--; renderSchedule(); return; }
  if(next){ if(sched.month===11){sched.month=0;sched.year++;}else sched.month++; renderSchedule(); return; }
  const day=e.target.closest('.cal-day:not(.empty):not(:disabled)');
  if(day){ sched.date=day.dataset.date; renderSchedule(); return; }
  const t=e.target.closest('.topt');
  if(t){ sched.time=t.dataset.time; renderSchedule(); return; }
  const nx=e.target.closest('[data-next]'); if(nx && !nx.disabled){ goStep(nx.dataset.next); return; }
});
